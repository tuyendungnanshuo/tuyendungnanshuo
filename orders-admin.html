<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Nanshuo Orders Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#b29267',secondary:'#111827',accent:'#0f5a47',bgLight:'#faf9f6'}}}}</script>
  <style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#faf9f6}.serif{font-family:'Playfair Display',serif}.card{background:#fff;border:1px solid #eee;border-radius:24px}.input{width:100%;border:1px solid #e5e7eb;border-radius:16px;padding:12px 14px;outline:none;background:#fff}.input:focus{border-color:#b29267}.label{display:block;font-size:11px;font-weight:800;color:#6b7280;margin-bottom:7px}</style>
</head>
<body>
  <div id="setup" class="hidden min-h-screen grid place-items-center p-6"><div class="card p-8 max-w-xl"><h1 class="serif text-3xl font-bold">Chưa kết nối Supabase</h1><p class="mt-3 text-gray-500">Kiểm tra config.js trước khi sử dụng quản lý đơn hàng.</p></div></div>
  <div id="login" class="hidden min-h-screen grid place-items-center p-6"><form id="login-form" class="card p-8 w-full max-w-md"><div class="w-12 h-12 rounded-2xl bg-secondary text-white grid place-items-center"><i class="fa-solid fa-lock"></i></div><h1 class="serif text-3xl font-bold mt-6">Quản lý đơn hàng</h1><p class="text-sm text-gray-500 mt-2">Dùng cùng tài khoản Supabase Admin.</p><div class="mt-6"><label class="label">Email</label><input id="email" type="email" required class="input"></div><div class="mt-4"><label class="label">Mật khẩu</label><input id="password" type="password" required class="input"></div><div id="login-error" class="hidden text-sm text-red-600 mt-3"></div><button class="mt-6 w-full rounded-2xl bg-secondary text-white py-4 font-bold">Đăng nhập</button></form></div>

  <div id="dashboard" class="hidden min-h-screen">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-gray-100"><div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-3"><div><div class="font-extrabold">NANSHUO <span class="text-primary">Orders</span></div><div id="admin-email" class="text-[10px] text-gray-400 mt-1"></div></div><div class="flex flex-wrap justify-end gap-2"><a href="catalog-admin.html" class="rounded-full border border-gray-200 px-4 py-2.5 text-xs font-bold"><i class="fa-solid fa-shirt mr-2"></i>Sản phẩm</a><a href="admin.html" class="hidden sm:inline-flex rounded-full border border-gray-200 px-4 py-2.5 text-xs font-bold">Website Studio</a><button id="logout" class="rounded-full bg-secondary text-white px-4 py-2.5 text-xs font-bold">Đăng xuất</button></div></div></header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
      <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-5"><div><div class="text-[10px] uppercase tracking-[.18em] text-primary font-bold">Customer Orders</div><h1 class="serif text-3xl md:text-4xl font-bold mt-1">Yêu cầu đặt hàng</h1><p class="text-sm text-gray-500 mt-2">Thông tin khách hàng chỉ hiển thị sau khi đăng nhập admin.</p></div><button id="refresh" class="rounded-full bg-secondary text-white px-5 py-3 text-xs font-bold"><i class="fa-solid fa-rotate mr-2"></i>Tải lại</button></div>

      <div id="stats" class="mt-7 grid grid-cols-2 md:grid-cols-5 gap-3"></div>
      <div class="card p-5 mt-5 grid md:grid-cols-3 gap-4"><div><label class="label">Trạng thái</label><select id="filter-status" class="input"><option value="">Tất cả</option><option value="new">Mới</option><option value="contacted">Đã liên hệ</option><option value="confirmed">Đã xác nhận</option><option value="completed">Hoàn tất</option><option value="cancelled">Đã hủy</option></select></div><div class="md:col-span-2"><label class="label">Tìm kiếm</label><input id="filter-search" class="input" placeholder="Tên khách, SĐT, sản phẩm, cửa hàng..."></div></div>
      <div id="message" class="hidden mt-5 rounded-2xl bg-amber-50 border border-amber-200 p-4 text-sm text-amber-900"></div>
      <div id="orders-list" class="mt-6 grid gap-4"></div>
    </main>
  </div>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 hidden bg-secondary text-white px-5 py-3 rounded-full text-sm z-50"></div>
  <script src="config.js"></script>
  <script type="module" src="orders-admin.js?v=20260830-order1"></script>
</body>
</html>
